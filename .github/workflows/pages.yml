# Publishes the repository's games as one website with GitHub Pages:
#   /              Grandstand, the original game, exactly as it is in docs/index.html (so its address does not change)
#   /prem-wheel/   Prem Wheel, the flat site that draft/tools/stage.mjs builds
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions (it was "Deploy from a branch", serving docs/). After that every
# push to main that touches either game redeploys the whole site.
name: Deploy Prem Wheel

on:
  push:
    branches: [main]
    paths: ['draft/**', 'stickers/src/**', 'stickers/test/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the game
        run: |
          (cd stickers && npm test)
          (cd draft && npm test)
      - name: Build the site
        run: |
          mkdir _site
          cp -r docs/. _site/
          node draft/tools/stage.mjs _site/prem-wheel
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
