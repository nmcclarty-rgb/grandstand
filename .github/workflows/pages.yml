# Publishes Prem Wheel as a website with GitHub Pages: the flat site that draft/tools/stage.mjs builds (index.html at the root, no build step beyond that).
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions. After that every push to main that touches the game redeploys it.
name: Deploy Prem Wheel

on:
  push:
    branches: [main]
    paths: ['draft/**', 'stickers/src/**', 'stickers/test/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the game
        run: |
          (cd stickers && npm test)
          (cd draft && npm test)
      - name: Build the site
        run: |
          node draft/tools/stage.mjs _site
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
