  #hud {

    font-family: var(--head); font-size: 11px; padding: 10px;
    background: #100c1e; color: var(--ink);
    border: 2px solid var(--line); border-radius: 7px; width: 100%;

  /* ── character select grid ──────────────────────────────────── */

    display: flex; flex-direction: column; align-items: center; gap: 4px;

  .pick.on { border-color: var(--gold); background: linear-gradient(180deg, #6b4bb8, #402a80); }

  .pickname { font-family: var(--head); font-size: 5px; line-height: 1.5; color: var(--ink-dim); }

  /* ── optional seed, tucked away so it is there without being in the way ── */
  .seed-box {
    background: linear-gradient(180deg, var(--panel-2), #201936);
    border: 2px solid var(--line); border-radius: 9px; padding: 9px 11px;

    font-family: var(--head); font-size: 7px; letter-spacing: .5px;
    color: var(--ink-dim); cursor: pointer; list-style: none;
  }
  .seed-box > summary::-webkit-details-marker { display: none; }
  .seed-box > summary::before { content: '▸ '; color: var(--gold); }
  .seed-box[open] > summary::before { content: '▾ '; }
  .seed-box[open] > summary { margin-bottom: 8px; }
  .seed-box .txt { margin-bottom: 6px; }

  .host-line {

    border: 2px solid #3f5a8c; border-radius: 9px; padding: 9px 11px;
    border-left: 5px solid #5a7fc0;
  }
  .host-line canvas { image-rendering: pixelated; flex: 0 0 auto; margin-top: 1px; }
  .host-name {
    font-family: var(--head); font-size: 6px; letter-spacing: 1px;
    color: #8fb4e8; margin-bottom: 4px;
  }
  .host-says { font-size: 15px; line-height: 1.5; color: #dce7fa; font-style: italic; }

  /* ── ladder ─────────────────────────────────────────────────── */
  .ladder-bar { display: flex; align-items: center; gap: 9px; }

  .opt .val { display: none; }

    height: 11px; background: #100c1e; border: 2px solid var(--line);

  /* ── fighter bars ───────────────────────────────────────────── */
  .fighter-bar { display: flex; flex-direction: column; gap: 3px; }
  .fighter-bar .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .fighter-bar .nm { font-family: var(--head); font-size: 9px; }
  .fighter-bar .hpnum { font-family: var(--head); font-size: 8px; color: var(--ink-dim); }
  .hp-track {
    height: 11px; background: #100c1e; border: 2px solid var(--line);

  .hp-fill { height: 100%; background: linear-gradient(180deg,#86e6a4,var(--green)); transition: width .3s ease-out; }

  /* ── cards and misc ─────────────────────────────────────────── */
  .card {
    background: linear-gradient(180deg, var(--panel-2), #201936);
    border: 2px solid var(--line); border-radius: 9px; padding: 11px;
    display: flex; flex-direction: column; gap: 7px;
    box-shadow: 0 2px 0 #120d22;

  .card.gold { border-color: var(--gold); }
  .card.red { border-color: var(--red); }
  .card.blue { border-color: var(--blue); }
  .card.green { border-color: var(--green); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(86px,1fr)); gap: 6px; }
  .stat { background: #100c1e; border: 2px solid var(--line); border-radius: 7px; padding: 8px; }
  .stat .k { font-family: var(--head); font-size: 6px; color: var(--ink-dim); display: block; margin-bottom: 5px; }
  .stat .v { font-family: var(--head); font-size: 13px; color: var(--gold); }
  .feedback { font-family: var(--head); font-size: 13px; line-height: 1.6; }
  .feedback.good { color: var(--green); }
  .feedback.bad  { color: var(--red); }
  .feedback.mid  { color: var(--gold); }
  .note {
    font-size: 14px; color: var(--ink-dim); line-height: 1.5;
    border-left: 3px solid var(--line-hi); padding-left: 9px;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px;
    background: var(--panel-2); border: 2px solid var(--gold); border-radius: 8px;
    color: var(--gold); font-family: var(--head); font-size: 9px;
    padding: 10px 13px; z-index: 50; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.6);
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { font-family: var(--head); font-size: 7px; color: var(--ink-dim); text-align: left; padding: 6px 4px; }
  td { padding: 7px 4px; border-top: 2px solid var(--line); }
  td.n { font-family: var(--head); font-size: 9px; color: var(--gold); }
  .kbd {
    font-family: var(--head); font-size: 7px; color: var(--ink-dim);
    border: 2px solid var(--line); border-radius: 4px; padding: 2px 5px; background: #100c1e;
  }
  .warn-strip {
    font-size: 12px; color: #171128; background: var(--gold);
    padding: 6px 9px; font-weight: 700; border-radius: 6px;
  }
  .warn-strip.red { background: var(--red); color: #fff; }

  @media (max-width: 420px) {
    h1 { font-size: 15px; }
    .q-prompt { font-size: 10px; line-height: 1.75; }
    .opt { font-size: 15px; }
    .rung-name { font-size: 9px; }
  }
</style>

function paintHostFace() {
  for (const cv of panel.querySelectorAll('canvas.hostface')) {
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.clearRect(0, 0, cv.width, cv.height);
    drawPresenterFace(c, HOST, 0, 0, 34);

function layout() {
  const app = $('app');
  const hudH = $('hud').classList.contains('on') ? $('hud').offsetHeight : 0;
  const budget = Math.min((app.clientHeight - hudH) * 0.54, app.clientWidth * 0.60);
  stage.style.height = `${Math.max(120, Math.round(budget))}px`;
  resize();
  const drawn = $('game').getBoundingClientRect().height;
  if (drawn > 0) stage.style.height = `${Math.round(drawn)}px`;
}
window.addEventListener('resize', layout);

// ── the ladder ─────────────────────────────────────────────────────────────
function screenLadder() {
  G.screen = 'ladder';
  setHud(true);
  const r = G.run;
  const rung = r.rung;
  // He introduces the rung you have walked to, and nags when you're spent.
  say(r.energy <= ENTER_COST * 2 && !rung.cleared ? pick(SCRIPT.lowEnergy) : lineForRung(rung));
  const l = r.ladder;
  const canGoBack = r.at > 1;
  const canGoOn = r.at < RUNGS && l.available(r.at + 1);
  const isRest = rung.kind === KIND.PHYSIO || rung.kind === KIND.BONUS;
  const affordable = r.canAfford(ENTER_COST);

  let action;
  if (rung.cleared && isRest) {
    action = `<button disabled>ALREADY TAKEN</button>`;
  } else if (isRest) {
    action = `<button class="primary" data-act="rest">${rung.kind === KIND.PHYSIO ? 'SEE THE PHYSIO' : 'COLLECT'}</button>`;
  } else if (!affordable) {
    action = `<button disabled>NOT ENOUGH ENERGY (${ENTER_COST})</button>`;
  } else {
    action = `<button class="primary" data-act="fight">${rung.cleared ? 'REMATCH' : 'HAVE A GO'} (-${ENTER_COST})</button>`;
  }

  const who = rung.fighter
    ? `<div class="rung-head">
         <canvas class="rungface" width="52" height="52"></canvas>
         <div>
           <div class="rung-name">${esc(rung.fighter.name)}</div>
           <span class="epithet">${esc(rung.fighter.epithet)}</span>
           <div class="small dim">${esc(SPORTS[rung.fighter.sport]?.name || 'ALL SPORTS')}
             · TIER ${rung.fighter.tier} · ${rung.fighter.hp} COND · ${rung.fighter.power} POWER</div>
         </div>
       </div>`
    : `<div class="rung-name">${rung.kind === KIND.PHYSIO ? 'THE PHYSIO ROOM' : 'THE CLUB SHOP'}</div>
       <p class="small dim">${rung.kind === KIND.PHYSIO
          ? 'Magic sponge, cold spray, back out you go. Restores over half your condition.'
          : 'A match programme and a spare nutmeg. Take it, you have earned it.'}</p>`;

  show(`
    <div class="screen on">
      ${hostBox()}
      <div class="ladder-bar">
        <button class="nav" data-act="rung-prev" ${canGoBack ? '' : 'disabled'}>◀</button>
        <div class="ladder-meta">
          <div class="small dim">RUNG ${rung.n} OF ${RUNGS} · ${esc(rung.venue)}</div>
          <div class="stars-line">${starStr(rung.stars)}
            <span class="dim">${l.totalStars()}/${l.maxStars()} TOTAL</span></div>
        </div>
        <button class="nav" data-act="rung-next" ${canGoOn ? '' : 'disabled'}>▶</button>
      </div>
      <div class="card ${rung.kind === KIND.BOSS ? 'red' : ''}">
        ${who}
        ${rung.fighter ? `<p class="small">"${esc(rung.fighter.taunt)}"</p>` : ''}
      </div>
      <div class="btn-row">${action}</div>
      <p class="small dim">${r.player.nutmegs} nutmeg${r.player.nutmegs === 1 ? '' : 's'} left
        · ${l.clearedCount()}/${RUNGS} rungs cleared
        · <span class="dim">✕ above ends the day</span></p>
    </div>`);

  const fc = panel.querySelector('canvas.rungface');
  if (fc && rung.fighter) {
    const c = fc.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.fillStyle = '#2b2448'; c.fillRect(0, 0, 52, 52);
    drawFace(c, rung.fighter, 1, 0, 50);
  }
  layout();
  updateHud();
}

function screenResolve() {
  const b = G.battle;
  const r = b.lastResult;
  stopTimer();

  let head, cls;
  if (r.sentOff) { head = 'SENT OFF — YOU WATCH THAT ONE GO PAST'; cls = 'bad'; }
  else if (r.timedOut) { head = 'TOO SLOW — THE WHISTLE WENT'; cls = 'bad'; }
  else if (r.phase === PHASE.STRIKE) {
    head = r.perfect ? 'SCREAMER!' : r.worst ? 'SCUFFED IT' : 'GOOD CONTACT';
    cls = r.perfect ? 'good' : r.worst ? 'bad' : 'mid';
  } else {
    head = r.perfect ? 'BLOCKED IT WELL' : r.worst ? 'CAUGHT FLUSH' : 'TOOK SOME OF IT';
    cls = r.perfect ? 'good' : r.worst ? 'bad' : 'mid';
  }

  const detail = r.sentOff
    ? `<p>You take <b style="color:var(--red)">${r.taken}</b>.</p>`
    : r.phase === PHASE.STRIKE
      ? `<p><b>${esc(r.option.label)}</b> — ${r.option.value} ${esc(r.unit)}
         → <b style="color:var(--gold)">${r.damage} DAMAGE</b>
         ${r.speed > 0.25 ? '<span class="dim">(quick off the mark)</span>' : ''}</p>`
      : `<p><b>${esc(r.option.label)}</b> — ${r.option.value} ${esc(r.unit)}
         → you take <b style="color:var(--red)">${r.taken}</b>
         ${r.blocked > 0 ? `<span class="dim">(${r.blocked} blocked)</span>` : ''}</p>`;

  const cardLine = r.card === 'red'
    ? '<div class="warn-strip red">RED CARD. You sit the next one out.</div>'
    : r.card === 'yellow'
      ? '<div class="warn-strip">BOOKED. One more and you\'re off.</div>' : '';

  show(`
    <div class="screen on">
      ${fighterBars()}
      <div class="feedback ${cls}">${esc(head)}</div>
      ${detail}
      ${!r.sentOff ? `<p class="small dim">Best answer was
        <b style="color:var(--green)">${r.correctValue} ${esc(r.unit)}</b>.</p>` : ''}
      ${cardLine}
      ${b.question && b.question.note && !r.sentOff ? `<div class="note">${esc(b.question.note)}</div>` : ''}
      <div class="btn-row"><button class="primary" data-act="advance">CARRY ON</button></div>
    </div>`);
  layout();
}

function screenBattleEnd(won) {
  stopTimer();
  const b = G.battle;
  const s = b.summary();
  const before = G.rung.stars;
  const vrep = won ? b.victoryRep() : 0;
  G.run.finishBattle(G.rung, b, won);
  const gained = G.rung.stars - before;
  if (won) sfx.win(); else sfx.lose();

  G.scene.foeDown = won;
  G.scene.playerDown = !won;
  const runOver = G.run.over;
  say(lineForResult(won, G.run.player));

  show(`
    <div class="screen on">
      ${hostBox()}
      <h2 style="color:${won ? 'var(--green)' : 'var(--red)'}">
        ${won ? 'HAVE THAT' : 'STRETCHERED OFF'}</h2>
      <p>"${esc(won ? b.foe.defeat : b.foe.taunt)}"</p>
      ${won ? `<div class="star-award">${starStr(G.rung.stars)}
        <span class="small dim">${gained > 0 ? `+${gained} this time` : 'no improvement'}</span></div>` : ''}
      <div class="stat-grid">
        <div class="stat"><span class="k">ANSWERED</span><span class="v">${s.answered}</span></div>
        <div class="stat"><span class="k">PERFECT</span><span class="v">${s.perfects}</span></div>
        <div class="stat"><span class="k">ACCURACY</span><span class="v">${Math.round(s.accuracy * 100)}%</span></div>
        <div class="stat"><span class="k">BEST COMBO</span><span class="v">×${s.bestCombo}</span></div>
        <div class="stat"><span class="k">REP</span><span class="v">${s.rep + vrep}</span></div>
        ${s.cards ? `<div class="stat"><span class="k">CARDS</span><span class="v" style="color:var(--red)">${s.cards}</span></div>` : ''}
      </div>
      ${!won ? '<p class="small dim">You lose energy and pick yourself up on 30% condition.</p>' : ''}
      <div class="btn-row">
        <button class="primary" data-act="${runOver ? 'results' : 'back-to-ladder'}">
          ${runOver ? 'SEE THE SCORE' : 'BACK TO THE LADDER'}</button>
      </div>
    </div>`);
  layout();
  updateHud();
}

// TIMER
// ═══════════════════════════════════════════════════════════════════════════
function startTimer() { G.timer.running = true; G.timer.start = performance.now(); G.timer.lastTick = 0; }
function stopTimer() { G.timer.running = false; }

function tickTimer() {
  if (!G.timer.running) return;
  const el = $('timer-fill');
  if (!el) return;
  const elapsed = performance.now() - G.timer.start;
  const frac = Math.max(0, 1 - elapsed / ANSWER_MS);
  el.style.width = `${frac * 100}%`;
  el.className = frac < 0.22 ? 'panic' : frac < 0.5 ? 'warn' : '';
  const secs = Math.ceil((ANSWER_MS - elapsed) / 1000);
  if (secs <= 3 && secs !== G.timer.lastTick && secs > 0) { G.timer.lastTick = secs; sfx.tick(); }
  if (elapsed >= ANSWER_MS) {
    stopTimer();
    if (G.battle) doAnswer(worstIndex(), ANSWER_MS);
  }
}

function worstIndex() {
  const b = G.battle;
  const vals = b.question.options.map((o) => o.value);
  return vals.indexOf(b.phase === PHASE.BLOCK ? Math.max(...vals) : Math.min(...vals));
}

// ACTIONS

function startRun() {
  const seed = makeSeedFrom(G.setup.seed);
  G.run = new Run({ seed, sports: G.setup.sports, characterId: G.setup.character, name: G.setup.name });
  G.battle = null; G.rung = null;
  savePrefs({ lastCharacter: G.setup.character, lastName: G.setup.name });
  G.camX = rungPos(1).x - VIEW_W / 2;
  sfx.whistle();
  screenLadder();
  say(pick(SCRIPT.runStart(G.run.character.name)));
  paintHostFace();
  const box = panel.querySelector('.host-says');
  if (box) box.textContent = `\u201c${G.hostLine}\u201d`;
}

/**
 * Clearing a rung moves you up to the next one.
 *
 * Standing on someone you have just beaten and having to press right is a tax
 * on the common case: nearly everyone wants the next fight. Going back for a
 * better star rating is the rarer choice, so that is the one that costs a
 * button press — and the left arrow is right there.
 */
function stepUp() {
  const r = G.run;
  if (!r || r.over) return;
  if (!r.rung.cleared) return;              // lost, or walked away — stay put
  if (r.ladder.available(r.at + 1)) r.moveTo(r.at + 1);
}

function moveRung(delta) {
  const r = G.run;
  if (!r || r.over) return;
  const target = r.at + delta;
  if (!r.ladder.available(target)) { sfx.blocked(); return; }
  r.moveTo(target);
  sfx.step();
  screenLadder();
}

function enterBattle() {
  const r = G.run;
  const rung = r.rung;
  if (!r.canAfford(ENTER_COST)) { sfx.blocked(); return; }
  r.spendEnergy(ENTER_COST);
  G.rung = rung;
  sfx.encounter();
  say(rung.kind === 'boss' ? pick(SCRIPT.rung.boss) : '');
  G.scene.venue = rung.venue;
  G.battle = new Battle(r.player, rung.fighter, {
    level: rung.level,
    sports: G.setup.sports,
    usedQuestions: r.usedQuestions,
    seed: (r.seed ^ (rung.n * 104729)) >>> 0,
  });
  G.scene.player = r.player;
  G.scene.foe = G.battle.foe;
  G.scene.playerDown = G.scene.foeDown = false;
  G.scene.playerPose = G.scene.foePose = null;
  G.scene.floaters.length = 0;
  setHud(true);
  updateHud();
  screenBattleIntro();
}

function doAnswer(i, forcedMs) {
  const b = G.battle;
  if (!b || b.phase === PHASE.RESOLVE || G.busy) return;
  if (b.eliminated.includes(i)) return;
  G.busy = true;
  stopTimer();

  const wasStrike = b.phase === PHASE.STRIKE;
  if (wasStrike) G.scene.playerPose = 'strike'; else G.scene.foePose = 'strike';

  G.run.spendEnergy(BATTLE_TURN_COST);
  const r = b.answer(i, forcedMs);

  setTimeout(() => {
    G.scene.playerPose = G.scene.foePose = null;
    if (wasStrike) {
      G.scene.foeFlash = 9;
      floater(`-${r.damage}`, 340, 140, r.perfect ? '#ffd24a' : '#f87171', r.perfect);
      if (r.perfect) sfx.crit(); else sfx.hit();
      shakeStage(r.perfect ? 1.7 : 1);
    } else {
      G.scene.playerFlash = 9;
      G.scene.playerPose = 'guard';
      floater(`-${r.taken}`, 96, 146, '#f87171', r.taken > 30);
      if (r.perfect) sfx.block(); else sfx.takeHit();
      shakeStage(r.perfect ? 0.6 : 1.4);
      setTimeout(() => { G.scene.playerPose = null; }, 420);
    }
    if (r.card) sfx.card();
    updateHud();
    G.busy = false;
    screenResolve();
  }, 280);
}

function advanceBattle() {
  const b = G.battle;
  const next = b.advance();
  if (next === PHASE.WON) { screenBattleEnd(true); return; }
  if (next === PHASE.LOST) { screenBattleEnd(false); return; }
  if (b.phase === PHASE.RESOLVE) {          // sent off — they got a free hit
    G.scene.playerFlash = 9;
    floater(`-${b.lastResult.taken}`, 96, 146, '#f87171', true);
    sfx.takeHit(); shakeStage(1.5); updateHud();
    screenResolve(); return;
  }
  screenQuestion();
}

    case 'league': sfx.select(); screenLeague(); break;

      if (confirm('Wipe the league table and everything you have beaten? This cannot be undone.')) {
        wipeSave(); Object.assign(save, loadSave()); screenLeague();
      }

    case 'start-run':
      G.setup.seed = $('seedin')?.value || '';

    case 'rest': {

      if (res) toast(res.kind === KIND.PHYSIO

        : `CLUB SHOP — +${res.rep} REP, +1 NUTMEG`);

    case 'nutmeg':

function frame() {
  G.t++;
  tickTimer();
  if (G.scene.foeFlash > 0) G.scene.foeFlash--;
  if (G.scene.playerFlash > 0) G.scene.playerFlash--;
  for (let i = G.scene.floaters.length - 1; i >= 0; i--) {
    const f = G.scene.floaters[i];
    f.y += f.vy; f.life--;
    if (f.life <= 0) G.scene.floaters.splice(i, 1);
  }

  switch (G.screen) {
    case 'ladder': {
      const target = Math.max(0, Math.min(ladderWidth(RUNGS) - VIEW_W,
        rungPos(G.run.at).x - VIEW_W / 2));
      G.camX += (target - G.camX) * 0.14;
      drawLadderScene(ctx, G.run.ladder, G.run.at, Math.round(G.camX), G.t, G.run.player);
      break;
    }
    case 'select':
      drawSelectScene(ctx, {
        player: findCharacter(G.setup.character),
        foe: ROSTER[0],
        hint: 'TAP A FIGHTER BELOW',
      }, G.t);
      break;
    case 'battle':
      drawBattleScene(ctx, G.scene, G.t);
      break;
    default:
      drawTitleScene(ctx, G.t, HOST, G.hostTalking);
      break;
  }
  requestAnimationFrame(frame);
}

__def("engine/render.js", function (__exports, __req) {
/**
 * GRANDSTAND — scene rendering.
 *
 * Internal resolution is 480x270. Sprites stay crisp and pixel-snapped;
 * backgrounds use gradients and curves. That mix is deliberate — the look we
 * want is a 90s arcade cabinet, where hand-drawn characters sit on painted
 * backdrops, not an 8-bit console where everything is the same chunky grid.
 */

const { drawFighter, drawPortrait, drawFace, drawGroundShadow, drawPresenter, SPRITE_W, SPRITE_H, PORTRAIT_W, PORTRAIT_H, PRESENTER_W, PRESENTER_H } = __req("engine/sprites.js");

const VIEW_W = 480;
const VIEW_H = 270;

const px = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x | 0, y | 0, w | 0, h | 0); };

function setupCanvas(canvas) {
  const ctx = canvas.getContext('2d', { alpha: false });
  canvas.width = VIEW_W;
  canvas.height = VIEW_H;
  ctx.imageSmoothingEnabled = false;

  const resize = () => {
    const wrap = canvas.parentElement;
    const scale = Math.min(wrap.clientWidth / VIEW_W, wrap.clientHeight / VIEW_H);
    // Honest tradeoff: whole-number scales keep every source pixel exactly
    // square, but on a 420px-wide phone that means scale 1 and a postage stamp
    // in a black frame. We fit the space and let image-rendering:pixelated do
    // the snapping. Nobody notices a slightly uneven pixel; everybody notices
    // a tiny picture.
    canvas.style.width = `${Math.round(VIEW_W * scale)}px`;
    canvas.style.height = `${Math.round(VIEW_H * scale)}px`;
  };
  resize();
  window.addEventListener('resize', resize);
  return { ctx, resize };
}

// ── shared drawing helpers ─────────────────────────────────────────────────

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/** Glossy bevelled button, the look of the level-select reference. */
function drawBadge(c, x, y, w, h, col, opts = {}) {
  const { r = 9, lift = 3, gloss = true } = opts;
  const t = ramp(col);
  c.save();
  // drop shadow
  c.globalAlpha = 0.3;
  roundRect(c, x + 1, y + lift + 2, w, h, r); c.fillStyle = '#000'; c.fill();
  c.globalAlpha = 1;
  // bevel underneath
  roundRect(c, x, y + lift, w, h, r); c.fillStyle = t.darkest; c.fill();
  // face
  const g = c.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, t.light);
  g.addColorStop(0.5, t.base);
  g.addColorStop(1, t.dark);
  roundRect(c, x, y, w, h, r); c.fillStyle = g; c.fill();
  // rim
  roundRect(c, x, y, w, h, r);
  c.strokeStyle = t.darkest; c.lineWidth = 2; c.stroke();
  if (gloss) {
    c.globalAlpha = 0.34;
    roundRect(c, x + 3, y + 2, w - 6, h * 0.36, r * 0.6);
    c.fillStyle = '#ffffff'; c.fill();
    c.globalAlpha = 1;
  }
  c.restore();
}

function drawStars(c, cx, y, filled, total = 3, size = 7) {
  const gap = size + 2;
  const startX = cx - ((total - 1) * gap) / 2;
  for (let i = 0; i < total; i++) star(c, startX + i * gap, y, size / 2, i < filled);

function star(c, cx, cy, r, filled) {
  c.save();
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = (Math.PI / 5) * i - Math.PI / 2;
    const rr = i % 2 ? r * 0.45 : r;
    const fn = i === 0 ? 'moveTo' : 'lineTo';
    c[fn](cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr);
  }
  c.closePath();
  c.fillStyle = filled ? '#ffd24a' : '#3a3157';
  c.fill();
  c.strokeStyle = filled ? '#a8700c' : '#241f36';
  c.lineWidth = 1; c.stroke();
  c.restore();
}

function textShadowed(c, text, x, y, font, col, shadowCol = '#1a1424', align = 'center') {
  c.save();
  c.font = font; c.textAlign = align;
  c.fillStyle = shadowCol;
  c.fillText(text, x + 1, y + 1);
  c.fillStyle = col;
  c.fillText(text, x, y);
  c.restore();
}

// CROWD AND ARENA
// ═══════════════════════════════════════════════════════════════════════════

const CROWD_COLS = ['#c9403a', '#3b6ca8', '#d8a53a', '#3f9a5c', '#8b5cf6',
                    '#e2e8f0', '#e06a2b', '#2a9d8f'];

function drawCrowd(c, top, height, t, density = 8) {
  px(c, 0, top, VIEW_W, height, '#191430');
  const rows = Math.floor(height / density);
  for (let row = 0; row < rows; row++) {
    const y = top + 2 + row * density;
    const depth = row / rows;
    for (let x = -6; x < VIEW_W + 6; x += density) {
      // x starts negative for the off-screen bleed, and JS % keeps the sign,
      // so this has to be a floored modulo or the colour lookup goes undefined.
      const seed = (((x * 13 + row * 29) % 101) + 101) % 101;
      const wave = Math.sin(t / 10 - x / 30 + row * 0.35) > 0.72 ? -2 : 0;
      const col = CROWD_COLS[seed % CROWD_COLS.length];
      px(c, x, y + wave, density - 2, density - 2, mix(col, '#191430', 0.45 - depth * 0.3));
      px(c, x + 1, y - 2 + wave, density - 4, density - 4,
         mix(seed % 3 ? '#e8b48a' : '#7a4a21', '#191430', 0.45 - depth * 0.3));
    }
  }
  // roof girder and floodlight spill
  px(c, 0, top, VIEW_W, 4, '#0f0b1c');
  for (let x = 16; x < VIEW_W; x += 78) {
    px(c, x, top - 5, 14, 6, '#fdf3cd');
    c.save();
    c.globalAlpha = 0.12;
    const g = c.createRadialGradient(x + 7, top, 2, x + 7, top, 60);
    g.addColorStop(0, '#fff7d6'); g.addColorStop(1, 'rgba(255,247,214,0)');
    c.fillStyle = g; c.fillRect(x - 53, top - 6, 120, 70);
    c.restore();
  }
}

function drawBattleScene(ctx, s, t) {
  const look = VENUE_LOOK[s.venue] || VENUE_LOOK['THE REC'];
  const HORIZON = 150;

  const pFlash = s.playerFlash > 0, fFlash = s.foeFlash > 0;

  if (s.foe) {
    const fx = 292 + (fFlash ? shake : 0);
    if (!s.foeDown) drawGroundShadow(ctx, fx + (SPRITE_W * SC) / 2, feet - 2, 34);

    const px_ = 44 + (pFlash ? shake : 0);
    if (!s.playerDown) drawGroundShadow(ctx, px_ + (SPRITE_W * SC) / 2, feet - 2, 34);
    drawFighter(ctx, s.player, px_, top, {
      facing: 1, t, flash: pFlash, down: s.playerDown, pose: s.playerPose, scale: SC,

    ctx.restore();
  }
}

function drawSelectScene(ctx, s, t) {

  g.addColorStop(0, '#3a2c66');
  g.addColorStop(0.5, '#241b45');
  g.addColorStop(1, '#3a2c66');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  for (let i = 0; i < VIEW_W + VIEW_H; i += 26) {
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#c9b6ff';
    ctx.fillRect(i - VIEW_H + ((t / 3) % 26), 0, 8, VIEW_H);
    ctx.setTransform(1, 0.0, -0.6, 1, 0, 0);
    ctx.restore();
  }

  const PW = 146, PH = 210, PY = 26;

  // ── your pick, left ──
  if (s.player) {
    drawPortrait(ctx, s.player, 10, PY, PW, PH, { bg: '#6a55a8' });
    namePlate(ctx, 10, PY + PH - 26, PW, s.player.name, '#4ade80');
  }
  // ── first opponent, right ──
  if (s.foe) {
    ctx.save();
    ctx.translate(VIEW_W - 10, 0); ctx.scale(-1, 1);
    drawPortrait(ctx, s.foe, 0, PY, PW, PH, { bg: '#a8556a' });
    ctx.restore();
    namePlate(ctx, VIEW_W - 10 - PW, PY + PH - 26, PW, s.foe.name, '#f87171');
  }

  // ── centre: the globe, as per the arcade original ──
  drawGlobe(ctx, VIEW_W / 2, 112, 56, t);

  textShadowed(ctx, 'PLAYER SELECT', VIEW_W / 2, 216, '10px "Press Start 2P", monospace', '#ffd24a');
  const blink = Math.sin(t / 12) > -0.2;
  if (blink) {
    textShadowed(ctx, s.hint || 'PICK YOUR FIGHTER', VIEW_W / 2, 236,
      '7px "Press Start 2P", monospace', '#e8e3f5');
  }

  textShadowed(ctx, '1P', 12, 16, '10px "Press Start 2P", monospace', '#4ade80', '#1a1424', 'left');
  textShadowed(ctx, 'CPU', VIEW_W - 12, 16, '10px "Press Start 2P", monospace', '#f87171', '#1a1424', 'right');
}

function namePlate(c, x, y, w, text, col) {
  c.save();
  c.globalAlpha = 0.85;
  px(c, x, y, w, 24, '#120e22');
  c.globalAlpha = 1;
  px(c, x, y, w, 2, col);
  const size = text.length > 15 ? 6 : text.length > 11 ? 7 : 9;
  textShadowed(c, text, x + w / 2, y + 17, `${size}px "Press Start 2P", monospace`, col);
  c.restore();
}

function drawGlobe(c, cx, cy, r, t) {
  c.save();
  // ocean
  const g = c.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
  g.addColorStop(0, '#5aa6e8');
  g.addColorStop(0.7, '#2160a3');
  g.addColorStop(1, '#123d70');
  c.beginPath(); c.ellipse(cx, cy, r, r * 0.92, 0, 0, Math.PI * 2);
  c.fillStyle = g; c.fill();

  // landmasses, roughly Europe-and-friends, scrolling slowly
  c.save();
  c.beginPath(); c.ellipse(cx, cy, r - 1, r * 0.92 - 1, 0, 0, Math.PI * 2); c.clip();
  const off = ((t / 5) % (r * 3)) - r * 1.5;
  const land = [
    [-28, -34, 40, 20], [-8, -18, 26, 30], [12, -6, 22, 38], [-44, 6, 24, 16],
    [26, -32, 34, 18], [34, 10, 20, 26], [-20, 22, 30, 14],
  ];
  for (const [lx, ly, lw, lh] of land) {
    c.beginPath();
    c.ellipse(cx + lx + off, cy + ly, lw / 2, lh / 2, 0, 0, Math.PI * 2);
    c.fillStyle = '#3f8f4e'; c.fill();
    c.beginPath();
    c.ellipse(cx + lx + off, cy + ly - 2, lw / 2.4, lh / 2.6, 0, 0, Math.PI * 2);
    c.fillStyle = '#56a862'; c.fill();
  }
  c.restore();

  // venue pins blinking around the globe
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + t / 90;
    const px_ = cx + Math.cos(a) * r * 0.72;
    const py_ = cy + Math.sin(a) * r * 0.62;
    const on = Math.sin(t / 8 + i) > 0;
    c.beginPath(); c.arc(px_, py_, on ? 3.5 : 2.5, 0, Math.PI * 2);
    c.fillStyle = on ? '#ffd24a' : '#9c7ad8'; c.fill();
    c.strokeStyle = '#1a1424'; c.lineWidth = 1; c.stroke();
  }

  // rim light
  c.beginPath(); c.ellipse(cx, cy, r, r * 0.92, 0, 0, Math.PI * 2);
  c.strokeStyle = '#a8c8f0'; c.lineWidth = 2; c.stroke();
  c.restore();
}

// ═══════════════════════════════════════════════════════════════════════════
// THE LADDER — a route through a municipal park, not a dungeon
// ═══════════════════════════════════════════════════════════════════════════

const RUNG_GAP = 108;
const LADDER_PAD = 120;

function rungPos(n) {
  return {
    x: LADDER_PAD + (n - 1) * RUNG_GAP,
    y: 176 + Math.sin(n * 0.85) * 34,
  };
}
function ladderWidth(total) { return LADDER_PAD * 2 + (total - 1) * RUNG_GAP; }

function drawLadderScene(ctx, ladder, at, camX, t, playerChar) {
  // ── sky ──
  const sky = ctx.createLinearGradient(0, 0, 0, 150);
  sky.addColorStop(0, '#5b8ad0');
  sky.addColorStop(0.6, '#9dc0e6');
  sky.addColorStop(1, '#cfe3f2');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // ── clouds, slow parallax ──
  for (let i = 0; i < 7; i++) {
    const cx = ((i * 137 - camX * 0.12 + t * 0.10) % (VIEW_W + 140)) - 70;
    cloud(ctx, cx, 24 + (i % 3) * 22, 20 + (i % 4) * 7);
  }

  // ── distant hills ──
  hills(ctx, camX * 0.25, 118, '#6f9f6a', 44);
  hills(ctx, camX * 0.4, 132, '#5a8f57', 34);

  // ── the grass the whole thing sits on ──
  const grass = ctx.createLinearGradient(0, 128, 0, VIEW_H);
  grass.addColorStop(0, '#6cbb55');
  grass.addColorStop(0.45, '#57a844');
  grass.addColorStop(1, '#3f8a34');
  ctx.fillStyle = grass; ctx.fillRect(0, 128, VIEW_W, VIEW_H - 128);
  for (let y = 140; y < VIEW_H; y += 14) {
    ctx.save(); ctx.globalAlpha = 0.07;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, y, VIEW_W, 6);
    ctx.restore();
  }

  // ── floodlight pylons, mid parallax ──
  for (let i = 0; i < 6; i++) {
    const x = i * 220 - (camX * 0.55) % 220 - 60;
    pylon(ctx, x, 128);
  }

  // ── trees, behind the path so they never sit on top of a badge ──
  for (let i = 0; i < 10; i++) {
    const x = i * 168 - (camX * 0.85) % 168 - 80;
    tree(ctx, x, 142 + (i % 3) * 8, 0.85 + (i % 3) * 0.12);
  }

  // ── the path itself ──
  drawPath(ctx, ladder, camX);

  // ── rung badges ──
  for (const r of ladder.rungs) {
    const p = rungPos(r.n);
    const x = p.x - camX;
    if (x < -70 || x > VIEW_W + 70) continue;
    drawRung(ctx, r, x, p.y, ladder.available(r.n), r.n === at, t);
  }

  // ── you, standing just along from your rung ──
  // Dead-centre on the badge hides the face of whoever you are about to fight,
  // which is the one thing the ladder screen exists to show you.
  const here = rungPos(at);
  const hx = here.x - camX + 40;
  if (playerChar && hx > -60 && hx < VIEW_W + 60) {
    const feet = here.y + 38;
    drawGroundShadow(ctx, hx, feet, 15);
    drawFighter(ctx, playerChar, hx - SPRITE_W / 2, feet - SPRITE_H, { t, scale: 1, facing: -1 });
  }
}

function drawPath(c, ladder, camX) {
  c.save();
  c.lineCap = 'round';
  c.lineJoin = 'round';
  const pts = ladder.rungs.map((r) => {
    const p = rungPos(r.n);
    return { x: p.x - camX, y: p.y + 12 };
  });
  const trace = () => {
    c.beginPath();
    c.moveTo(pts[0].x - 90, pts[0].y);
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      c.quadraticCurveTo((a.x + b.x) / 2, a.y, b.x, b.y);
    }
    c.lineTo(pts[pts.length - 1].x + 90, pts[pts.length - 1].y);
  };
  trace(); c.strokeStyle = '#9d7a49'; c.lineWidth = 22; c.stroke();
  trace(); c.strokeStyle = '#d8b878'; c.lineWidth = 17; c.stroke();
  trace(); c.strokeStyle = '#eddcb4'; c.lineWidth = 9; c.stroke();
  c.restore();
}

const RUNG_LOOK = {
  [KIND.FIGHT]:  { col: '#4a9be0', label: null },
  [KIND.BOSS]:   { col: '#e0574a', label: null },
  [KIND.PHYSIO]: { col: '#4ec97a', label: '+' },
  [KIND.BONUS]:  { col: '#e0b040', label: '★' },
};

function drawRung(c, r, x, y, available, current, t) {
  const look = RUNG_LOOK[r.kind] || RUNG_LOOK[KIND.FIGHT];
  const locked = !available;
  const size = r.kind === KIND.BOSS ? 54 : 44;
  const bx = x - size / 2, by = y - size / 2;

  // pulsing ring on the rung you are standing on
  if (current) {
    const pulse = 4 + Math.sin(t / 7) * 3;
    c.save();
    c.globalAlpha = 0.55;
    c.beginPath(); c.arc(x, y + 2, size / 2 + pulse, 0, Math.PI * 2);
    c.strokeStyle = '#ffd24a'; c.lineWidth = 3; c.stroke();
    c.restore();
  }

  drawBadge(c, bx, by, size, size,
    locked ? '#6b6580' : r.cleared ? '#54b06a' : look.col,
    { r: r.kind === KIND.BOSS ? 12 : 10 });

  if (locked) {
    padlock(c, x, y + 2, 14);
  } else if (r.fighter) {
    c.save();
    roundRect(c, bx + 4, by + 3, size - 8, size - 8, 7); c.clip();
    drawFace(c, r.fighter, bx + 4, by - 1, size - 8);
    c.restore();
  } else if (look.label) {
    textShadowed(c, look.label, x, y + 9, '20px "Press Start 2P", monospace', '#ffffff');
  }

  // rung number badge
  c.save();
  c.beginPath(); c.arc(bx + 3, by + 3, 9, 0, Math.PI * 2);
  c.fillStyle = '#1a1424'; c.fill();
  c.strokeStyle = locked ? '#6b6580' : '#ffd24a'; c.lineWidth = 2; c.stroke();
  textShadowed(c, String(r.n), bx + 3, by + 7, '8px "Press Start 2P", monospace',
    locked ? '#9c93b8' : '#ffd24a');
  c.restore();

  if (r.cleared) drawStars(c, x, y + size / 2 + 12, r.stars, 3, 9);
  if (r.kind === KIND.BOSS && !locked) {
    textShadowed(c, 'FINAL', x, by - 8, '7px "Press Start 2P", monospace', '#ffd24a');
  }
}

function padlock(c, x, y, s) {
  px(c, x - s / 2, y - s / 4, s, s * 0.7, '#cfd3e0');
  px(c, x - s / 2, y - s / 4, s, 2, '#eef1f7');
  c.beginPath();
  c.arc(x, y - s / 4, s * 0.3, Math.PI, 0);
  c.strokeStyle = '#cfd3e0'; c.lineWidth = 3; c.stroke();
  px(c, x - 1.5, y + s * 0.05, 3, 5, '#5c6480');
}

function cloud(c, x, y, r) {
  c.save();
  c.globalAlpha = 0.85;
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(x, y, r * 0.6, 0, Math.PI * 2);
  c.arc(x + r * 0.55, y - r * 0.2, r * 0.45, 0, Math.PI * 2);
  c.arc(x + r * 1.05, y + r * 0.05, r * 0.5, 0, Math.PI * 2);
  c.arc(x + r * 0.5, y + r * 0.3, r * 0.5, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function hills(c, off, baseY, col, h) {
  c.save();
  c.fillStyle = col;
  c.beginPath();
  c.moveTo(-20, VIEW_H);
  for (let x = -20; x <= VIEW_W + 20; x += 10) {
    const y = baseY - Math.sin((x + off) / 66) * h * 0.5 - h * 0.4;
    c.lineTo(x, y);
  }
  c.lineTo(VIEW_W + 20, VIEW_H);
  c.closePath();
  c.fill();
  c.restore();
}

function tree(c, x, y, s) {
  const trunkH = 26 * s;
  px(c, x - 3 * s, y, 6 * s, trunkH, '#7a5230');
  px(c, x - 3 * s, y, 2 * s, trunkH, '#8f6238');
  c.save();
  c.fillStyle = '#2f7d3a';
  c.beginPath();
  c.arc(x, y - 6 * s, 17 * s, 0, Math.PI * 2);
  c.arc(x - 13 * s, y + 2 * s, 12 * s, 0, Math.PI * 2);
  c.arc(x + 13 * s, y + 2 * s, 12 * s, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = '#3f9c49';
  c.beginPath();
  c.arc(x - 3 * s, y - 11 * s, 11 * s, 0, Math.PI * 2);
  c.arc(x + 9 * s, y - 2 * s, 8 * s, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = '#55b85c';
  c.beginPath(); c.arc(x - 6 * s, y - 14 * s, 6 * s, 0, Math.PI * 2); c.fill();
  c.restore();
}

function pylon(c, x, groundY) {
  const h = 78;
  px(c, x, groundY - h, 4, h, '#6d7590');
  px(c, x, groundY - h, 2, h, '#8b93ad');
  px(c, x - 12, groundY - h - 16, 28, 16, '#59617a');
  for (let i = 0; i < 3; i++)
    for (let j = 0; j < 2; j++)
      px(c, x - 10 + i * 9, groundY - h - 14 + j * 7, 7, 5, '#fdf3cd');
}

// ═══════════════════════════════════════════════════════════════════════════
// TITLE
// ═══════════════════════════════════════════════════════════════════════════

/**
 * THE STUDIO.
 *
 * A Saturday-afternoon sports programme: monitor stack on the left, the set's
 * backdrop with its orbiting graphic behind, the production gallery working
 * away in the background, and the host at the desk. This is the frame the
 * whole game sits inside — he introduces every rung, so the opening shot had
 * better be his studio.
 *
 * It is a pastiche of a genre, not of any particular programme: the station
 * ident is our own and no real broadcaster's marks appear anywhere.
 */
function drawTitleScene(ctx, t, host, talking = false) {
  // ── the cyclorama ──
  const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, '#0b1f52');
  g.addColorStop(0.55, '#13327d');
  g.addColorStop(1, '#091634');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // Orbiting set graphics pushed out to the corners, so the wordmark and the
  // host both sit in clear air.
  atom(ctx, 62, 48, 34, t);
  atom(ctx, 418, 42, 29, t * 0.8);

  setLogo(ctx, VIEW_W / 2, 44, t);
  drawMonitorStack(ctx, 4, 106, t);
  drawGallery(ctx, 334, 112, t);

  // ── the host, framed head-and-shoulders behind his desk ──
  const hx = Math.round(VIEW_W / 2 - PRESENTER_W);      // scale 2
  drawPresenter(ctx, host, hx, 96, 2, t, talking);

  drawDesk(ctx, 212);
}

/** The set's orbiting graphic — every sports programme had one. */
function atom(c, cx, cy, r, t) {
  c.save();
  c.globalAlpha = 0.5;
  const glow = c.createRadialGradient(cx, cy, 2, cx, cy, r * 1.4);
  glow.addColorStop(0, 'rgba(120,190,255,0.5)');
  glow.addColorStop(1, 'rgba(120,190,255,0)');
  c.fillStyle = glow;
  c.fillRect(cx - r * 1.5, cy - r * 1.5, r * 3, r * 3);
  c.globalAlpha = 0.85;
  c.strokeStyle = '#7cc0ff';
  c.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    c.save();
    c.translate(cx, cy);
    c.rotate((i * Math.PI) / 3 + t / 180);
    c.beginPath();
    c.ellipse(0, 0, r, r * 0.36, 0, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }
  c.globalAlpha = 1;
  c.beginPath();
  c.arc(cx, cy, 5, 0, Math.PI * 2);
  c.fillStyle = '#d6ecff';
  c.fill();
  c.restore();
}

/** The programme's name, up on the set behind him. Doubles as the title. */
function setLogo(c, cx, y, t) {
  const pulse = 0.82 + Math.sin(t / 50) * 0.08;
  c.save();
  c.textAlign = 'center';
  // glow behind the letters
  c.globalAlpha = pulse * 0.35;
  const gl = c.createRadialGradient(cx, y - 7, 4, cx, y - 7, 150);
  gl.addColorStop(0, 'rgba(140,200,255,0.85)');
  gl.addColorStop(1, 'rgba(140,200,255,0)');
  c.fillStyle = gl;
  c.fillRect(cx - 160, y - 42, 320, 70);
  c.globalAlpha = 1;

  c.font = '26px "Press Start 2P", monospace';
  c.fillStyle = '#061436';
  c.fillText('GRANDSTAND', cx + 3, y + 3);
  c.fillStyle = '#2f5fa8';
  c.fillText('GRANDSTAND', cx + 1, y + 1);
  c.fillStyle = '#ffd24a';
  c.fillText('GRANDSTAND', cx, y);

  c.font = '8px "Press Start 2P", monospace';
  c.fillStyle = '#07152f';
  c.fillText('TRIVIA ATHLETIC', cx + 1, y + 21);
  c.fillStyle = '#bcd8f8';
  c.fillText('TRIVIA ATHLETIC', cx, y + 20);
  c.restore();
}

/** Bank of CRTs, each showing its own flickering nonsense. */
function drawMonitorStack(c, x, y, t) {
  const W = 58, H = 42;
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 2; col++) {
      const mx = x + col * (W + 4), my = y + row * (H + 4);
      px(c, mx, my, W, H, '#1b1b26');
      px(c, mx, my, W, 2, '#3a3a4e');
      const sx = mx + 4, sy = my + 4, sw = W - 8, sh = H - 10;
      const tint = ['#1f5e3a', '#5a2f2f', '#2c3f70', '#5a4a1f'][(row * 2 + col) % 4];
      px(c, sx, sy, sw, sh, tint);
      // a crowd-ish blur of moving blocks, so the screens look live
      for (let i = 0; i < 7; i++) {
        const bx = sx + (((i * 13 + Math.floor(t / 4) + row * 7) % sw));
        px(c, bx, sy + 3 + ((i * 5) % (sh - 6)), 4, 3, highlight(tint, 1.3));
      }
      px(c, sx, sy + ((Math.floor(t / 2) * 3) % sh), sw, 1, 'rgba(255,255,255,0.16)');
      px(c, mx + 2, my + H - 4, W - 4, 2, '#2a2a38');
    }
  }
}

/** The gallery: people at desks, still working while he talks. */
function drawGallery(c, x, y, t) {
  const SKIN = ['#e8b48a', '#7a4a21', '#f0c49b', '#5a3418', '#e8a878'];
  const HAIR = ['#3a2a18', '#1a1a1a', '#6b5a3a', '#2a2018', '#9a9a9a'];
  const TOP = ['#2f3a55', '#46324f', '#2c4a46', '#4a3a2c', '#38384a'];
  for (let i = 0; i < 4; i++) {
    const gx = x + 4 + i * 34;
    const gy = y + 18 + (i % 2) * 7;
    const lean = Math.sin(t / 38 + i * 2.1) > 0.75 ? 1 : 0;
    px(c, gx + 2 + lean, gy + 6, 16, 16, TOP[i % 5]);          // shoulders
    px(c, gx + 2 + lean, gy + 6, 5, 16, shadow(TOP[i % 5], 1));
    px(c, gx + 6 + lean, gy - 4, 9, 10, SKIN[i % 5]);          // head
    px(c, gx + 6 + lean, gy - 6, 9, 4, HAIR[i % 5]);           // hair
    px(c, gx + 8 + lean, gy + 1, 2, 1, '#2a2436');             // a suggestion of a face
    px(c, gx + 12 + lean, gy + 1, 2, 1, '#2a2436');
  }
  // the desk they are all sitting at, with monitor glow coming off it
  px(c, x, y + 30, VIEW_W - x, 5, '#2a4272');
  px(c, x, y + 30, VIEW_W - x, 2, '#4f73ad');
  px(c, x, y + 35, VIEW_W - x, 24, '#101f3f');
  for (let i = 0; i < 4; i++) {
    const mx = x + 8 + i * 34;
    px(c, mx, y + 21, 14, 11, '#16294d');
    px(c, mx + 1, y + 22, 12, 8, i % 2 ? '#2f5f8f' : '#2f7f6f');
    px(c, mx + 2, y + 23 + ((Math.floor(t / 6) + i) % 6), 10, 1, 'rgba(255,255,255,0.22)');
  }
}

/** The desk the whole programme is presented from. */
function drawDesk(c, y) {
  const g = c.createLinearGradient(0, y, 0, VIEW_H);
  g.addColorStop(0, '#2b3f6b');
  g.addColorStop(0.18, '#1b2a4d');
  g.addColorStop(1, '#0d1730');
  c.fillStyle = g;
  c.fillRect(0, y, VIEW_W, VIEW_H - y);
  px(c, 0, y, VIEW_W, 3, '#5a7fc0');
  px(c, 0, y + 3, VIEW_W, 2, '#16254a');
  // a sheaf of running order on the desk
  px(c, 300, y + 12, 44, 26, '#e8e6dd');
  px(c, 300, y + 12, 44, 2, '#ffffff');
  for (let i = 0; i < 4; i++) px(c, 305, y + 18 + i * 5, 32, 1, '#9aa0b0');
  px(c, 118, y + 16, 30, 20, '#dcdad2');
  px(c, 118, y + 16, 30, 2, '#ffffff');
}

function drawTitleWordmark(ctx, t) {
  const bounce = Math.round(Math.sin(t / 34) * 2);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '26px "Press Start 2P", monospace';
  ctx.fillStyle = '#7a1f1a'; ctx.fillText('GRANDSTAND', VIEW_W / 2 + 3, 46 + bounce);
  ctx.fillStyle = '#c9403a'; ctx.fillText('GRANDSTAND', VIEW_W / 2 + 1, 44 + bounce);

/**
 * GRANDSTAND — tone ramps.
 *
 * The single biggest difference between 8-bit and 16-bit-looking art is that
 * every colour is a *ramp*, not a swatch. One base colour becomes five tones,
 * with cool shadows and warm highlights — that's what reads as "painted"
 * rather than "filled in".
 */

const clamp = (n) => Math.max(0, Math.min(255, Math.round(n)));

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return `#${((clamp(r) << 16) | (clamp(g) << 8) | clamp(b)).toString(16).padStart(6, '0')}`;
}

/** Shadows drift cool (towards blue), highlights drift warm (towards yellow). */
function shadow(hex, amount = 1) {
  const [r, g, b] = hexToRgb(hex);
  const k = 1 - 0.34 * amount;
  return rgbToHex(r * k * 0.97, g * k, b * Math.min(1, k * 1.12));
}
function highlight(hex, amount = 1) {
  const [r, g, b] = hexToRgb(hex);
  const t = 0.34 * amount;
  return rgbToHex(r + (255 - r) * t, g + (255 - g) * t * 0.92, b + (255 - b) * t * 0.55);
}

/** Five tones from one colour: the whole art style in one function. */
function ramp(hex) {
  return {
    darkest: shadow(hex, 1.85),
    dark: shadow(hex, 1),
    base: hex,
    light: highlight(hex, 1),
    lightest: highlight(hex, 1.85),
  };
}

function mix(a, b, t) {
  const [r1, g1, b1] = hexToRgb(a);
  const [r2, g2, b2] = hexToRgb(b);
  return rgbToHex(r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t);
}

const INK = '#1a1424';       // outline colour for every sprite
const INK_SOFT = '#2e2440';

Object.assign(__exports, { hexToRgb, rgbToHex, shadow, highlight, ramp, mix, INK, INK_SOFT });
});

/**
 * GRANDSTAND — the ladder.
 *
 * Replaces the free-roam overworld. You climb a fixed run of rungs, one
 * opponent per rung, getting harder as you go, finishing with a boss. This is
 * the Street Fighter II world tour shape rather than a dungeon: the map is a
 * route, not a place, and the only navigation decision is whether to push on
 * or go back and beat a rung more convincingly.
 *
 * Cleared rungs can be replayed to improve your star rating, which is what
 * stops the ladder being a single one-way corridor — but replaying costs
 * energy, same as anything else.
 */

const { makeRng } = __req("engine/rng.js");
const { byTier, bosses } = __req("data/roster.js");

const RUNGS = 12;

const KIND = { FIGHT: 'fight', PHYSIO: 'physio', BONUS: 'bonus', BOSS: 'boss' };

const VENUES = [
  'THE REC',
  'THE LEISURE CENTRE',
  'THE ATHLETICS TRACK',
  'THE SNOOKER CLUB',
  'THE TENNIS COURTS',
  'THE MUNICIPAL LINKS',
  'THE SPORTS HALL',
  'THE PADDOCK',
  'THE COUNTY GROUND',
  'THE OLD BATHS',
  'THE VELODROME',
  'THE MAIN ARENA',
];

/** Star thresholds — see awardStars. */
const STAR_ACCURACY = 0.6;
const STAR_CONDITION = 0.6;

class Ladder {
  constructor(seed, opts = {}) {
    this.seed = seed;
    this.rng = makeRng(seed);
    this.sports = opts.sports || [];
    this.rungs = [];
    this.build();
  }

  build() {
    const rng = this.rng;
    const inFilter = (f) =>
      !this.sports.length || f.sport === 'any' || this.sports.includes(f.sport);
    const pool = (tier) => {
      const filtered = byTier(tier).filter(inFilter);
      return filtered.length ? filtered : byTier(tier);
    };

    // Draw without replacement inside a tier where we can, so one climb does
    // not put you against the same person three rungs running.
    const bags = { 1: rng.shuffle(pool(1)), 2: rng.shuffle(pool(2)), 3: rng.shuffle(pool(3)) };
    const take = (tier) => {
      if (!bags[tier].length) bags[tier] = rng.shuffle(pool(tier));
      return bags[tier].pop();
    };

    for (let i = 0; i < RUNGS; i++) {
      const n = i + 1;
      const last = n === RUNGS;
      // Rung 11 is a physio on purpose. Without it a decent player reaches the
      // boss on fumes and loses to attrition rather than to the questions,
      // which is the least satisfying way to end a climb.
      let kind = KIND.FIGHT;
      if (last) kind = KIND.BOSS;
      else if (n === 4 || n === 11) kind = KIND.PHYSIO;
      else if (n === 8) kind = KIND.BONUS;

      const tier = n <= 3 ? 1 : n <= 7 ? 2 : 3;
      const level = n <= 3 ? 1 : n <= 6 ? 2 : n <= 9 ? 3 : 4;

      this.rungs.push({
        n, kind, level,
        venue: VENUES[i % VENUES.length],
        fighter: kind === KIND.BOSS ? rng.pick(bosses())
               : kind === KIND.FIGHT ? take(tier) : null,
        cleared: false,
        stars: 0,
        attempts: 0,
      });
    }
  }

  get(n) { return this.rungs[n - 1]; }

  /** A rung is available once the one below it is cleared. */
  available(n) {
    if (n < 1 || n > RUNGS) return false;
    if (n === 1) return true;
    return this.rungs[n - 2].cleared;
  }

  /** The highest rung you can currently walk to. */
  frontier() {
    for (let n = 1; n <= RUNGS; n++) if (!this.rungs[n - 1].cleared) return n;
    return RUNGS;
  }

  clearedCount() { return this.rungs.filter((r) => r.cleared).length; }
  totalStars() { return this.rungs.reduce((a, r) => a + r.stars, 0); }
  maxStars() { return RUNGS * 3; }
  complete() { return this.rungs[RUNGS - 1].cleared; }
}

/**
 * One star for winning, one for answering well, one for not getting hurt.
 * Replaying a rung keeps your best rating.
 */
function awardStars(battle, player) {
  let stars = 1;
  const accuracy = battle.answered ? battle.perfects / battle.answered : 0;
  if (accuracy >= STAR_ACCURACY) stars++;
  if (player.hp / player.maxHp >= STAR_CONDITION) stars++;
  return stars;
}

__def("engine/rng.js", function (__exports, __req) {
/** Deterministic, seedable RNG so a "season" can be replayed or shared. */
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  const next = () => {
    // xorshift32
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 0x100000000;
  };
  next.int = (n) => Math.floor(next() * n);
  next.range = (a, b) => a + Math.floor(next() * (b - a + 1));
  next.pick = (arr) => arr[Math.floor(next() * arr.length)];
  next.shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(next() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  next.chance = (p) => next() < p;
  return next;
}

/** Turn a human-typed seed ("SHEARER") into a number. */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

Object.assign(__exports, { makeRng, hashSeed });
});

__def("engine/audio.js", function (__exports, __req) {
/**
 * GRANDSTAND — bleeps.
 *
 * WebAudio square/noise voices only. No audio files, so nothing to load and
 * nothing to licence. Muted until the first user gesture, per browser policy.
 */

let ctx = null;
let master = null;
let enabled = true;

function initAudio() {
  if (ctx) return ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  ctx = new AC();
  master = ctx.createGain();
  master.gain.value = 0.22;
  master.connect(ctx.destination);
  return ctx;
}

function setMuted(m) {
  enabled = !m;
  if (master) master.gain.value = m ? 0 : 0.22;
}
function isMuted() { return !enabled; }

function tone(freq, dur, type = 'square', vol = 1, slideTo = null) {
  if (!ctx || !enabled) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, ctx.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ctx.currentTime + dur);
  g.gain.setValueAtTime(0.0001, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.4 * vol, ctx.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  o.connect(g); g.connect(master);
  o.start(); o.stop(ctx.currentTime + dur + 0.02);
}

function noise(dur, vol = 1, filterHz = 1200) {
  if (!ctx || !enabled) return;
  const n = ctx.sampleRate * dur;
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = filterHz;
  const g = ctx.createGain(); g.gain.value = 0.5 * vol;
  src.connect(f); f.connect(g); g.connect(master);
  src.start();
}

const seq = (notes) => {
  if (!ctx || !enabled) return;
  notes.forEach(([f, t, d], i) => setTimeout(() => tone(f, d || 0.09), t));
};

const sfx = {
  step:    () => tone(180, 0.035, 'square', 0.35),
  blocked: () => tone(90, 0.07, 'square', 0.4),
  select:  () => tone(660, 0.05, 'square', 0.6),
  confirm: () => seq([[520, 0], [780, 60]]),
  back:    () => tone(300, 0.07, 'square', 0.5),
  encounter: () => seq([[220, 0, 0.08], [330, 70, 0.08], [440, 140, 0.16]]),
  hit:     () => { noise(0.12, 0.8, 900); tone(140, 0.1, 'square', 0.5, 70); },
  crit:    () => { noise(0.2, 1, 2200); seq([[880, 0, 0.06], [1180, 50, 0.06], [1560, 100, 0.14]]); },
  takeHit: () => { noise(0.16, 0.9, 500); tone(110, 0.14, 'sawtooth', 0.5, 60); },
  block:   () => { tone(400, 0.05, 'square', 0.5); setTimeout(() => tone(300, 0.07, 'square', 0.4), 40); },
  card:    () => seq([[520, 0, 0.1], [400, 110, 0.18]]),
  pickup:  () => seq([[660, 0, 0.05], [880, 55, 0.05], [1320, 110, 0.1]]),
  win:     () => seq([[523, 0, 0.1], [659, 110, 0.1], [784, 220, 0.1], [1047, 330, 0.3]]),
  lose:    () => seq([[392, 0, 0.14], [330, 150, 0.14], [262, 300, 0.4]]),
  tick:    () => tone(1200, 0.02, 'square', 0.25),
  whistle: () => { tone(2000, 0.18, 'square', 0.5); setTimeout(() => tone(2400, 0.22, 'square', 0.5), 60); },
};

Object.assign(__exports, { initAudio, setMuted, isMuted, sfx });

__def("game/battle.js", function (__exports, __req) {
/**
 * GRANDSTAND — turn-based combat.
 *
 * The question IS the weapon.
 *
 *   STRIKE turn: you're asked who has the MOST of something. The number on
 *                the answer you pick becomes the hit. Pick the biggest number,
 *                hit hardest. Pick a smaller one, still connect — just weaker.
 *                There is no "wrong", only "soft".
 *
 *   BLOCK turn:  they're coming at you. You're asked who has the FEWEST.
 *                Pick the smallest number to take the sting out of it.
 *
 * Alternating MOST/FEWEST is the whole skill ceiling: you have to keep
 * remembering which way round you're being asked, at speed, with a clock on.
 *
 * DAMAGE MODEL — why we normalise
 * ------------------------------
 * Raw stat values are wildly different in scale (Tendulkar's 15,921 Test runs
 * vs 5 Olympic rings). So the damage is rank-normalised within the question:
 *
 *     ratio = 0.25 + 0.75 * (value - min) / (max - min)
 *
 * Best answer = 1.00x, worst = 0.25x, regardless of whether the numbers are
 * single digits or five figures. The raw number is still shown, big, because
 * that's the fantasy — "260 GOALS" landing on someone's chin. See DESIGN.md.
 */

const { QUESTIONS } = __req("data/questions.js");
const { makeRng } = __req("engine/rng.js");

const PHASE = {
  INTRO: 'intro',
  STRIKE: 'strike',       // player answering, attacking
  BLOCK: 'block',         // player answering, defending
  RESOLVE: 'resolve',     // showing the result of an answer
  WON: 'won',
  LOST: 'lost',
};

const ANSWER_MS = 12000;
const SPEED_BONUS_MAX = 0.5;   // +50% for an instant answer
const CRIT_BONUS = 0.5;        // +50% for the perfect pick
const COMBO_STEPS = [1, 1, 1.25, 1.5, 2];  // by combo length
const BLOCK_FLOOR = 0.25;      // best possible block takes 25% through

/**
 * Character perks, read off `player.perk`. Kept here rather than in the
 * character data so there is one place to look when a fight does something
 * surprising.
 *
 *   speedMult   multiplies the clock bonus
 *   blockFloor  replaces BLOCK_FLOOR — lower is a better blocker
 *   repMult     multiplies all rep earned
 *   comboBoost  starts the combo ladder this many rungs up
 *   glassJaw    multiplies damage taken
 */
const PERK_KEYS = ['speedMult', 'blockFloor', 'repMult', 'comboBoost', 'glassJaw'];

class Battle {
  /**
   * @param {object} player  { name, hp, maxHp, power, palette, nutmegs }
   * @param {object} foe     roster fighter
   * @param {object} opts    { level, sports:[], seed, usedQuestions:Set, pvp:bool, player2 }
   */
  constructor(player, foe, opts = {}) {
    this.player = player;
    this.opts = opts;
    this.rng = makeRng(opts.seed || (Date.now() & 0xffffffff));
    this.level = opts.level || 1;
    this.sports = opts.sports || [];
    this.used = opts.usedQuestions || new Set();
    this.pvp = !!opts.pvp;

    const scale = 1 + (this.level - 1) * 0.20;
    this.foe = {
      ...foe,
      maxHp: Math.round(foe.hp * scale),
      hp: Math.round(foe.hp * scale),
      power: Math.round(foe.power * scale),
    };

    this.round = 1;
    this.phase = PHASE.INTRO;
    this.combo = 0;
    this.bestCombo = 0;
    this.yellowCards = 0;
    this.redCard = false;
    this.skipNext = false;
    this.log = [];
    this.question = null;
    this.lastResult = null;
    this.perfects = 0;
    this.answered = 0;
    this.repEarned = 0;
    this.askedAt = 0;
    this.eliminated = [];   // option indices removed by a nutmeg
  }

  // ── question selection ────────────────────────────────────────────────
  pickQuestion() {
    const filter = this.sports;
    const matches = (q) =>
      (!filter || filter.length === 0 || filter.includes(q.sport));

    let pool = QUESTIONS.map((q, i) => ({ q, i })).filter(({ q }) => matches(q));
    if (pool.length === 0) pool = QUESTIONS.map((q, i) => ({ q, i }));

    // Half the time, lean into the opponent's own discipline — fighting Tank
    // Bruno should feel like a boxing quiz.
    const themed = pool.filter(({ q }) => q.sport === this.foe.sport);
    if (themed.length >= 2 && this.rng.chance(0.5)) pool = themed;

    let fresh = pool.filter(({ i }) => !this.used.has(i));
    if (fresh.length === 0) { this.used.clear(); fresh = pool; }

    const chosen = this.rng.pick(fresh);
    this.used.add(chosen.i);

    // Shuffle option order so the biggest number isn't always in slot 1.
    const order = this.rng.shuffle(chosen.q.options.map((_, i) => i));
    return {
      ...chosen.q,
      index: chosen.i,
      options: order.map((i) => chosen.q.options[i]),
    };
  }

  values() { return this.question.options.map((o) => o.value); }
  maxValue() { return Math.max(...this.values()); }
  minValue() { return Math.min(...this.values()); }

  /** 0.25 .. 1.00, where 1.00 is the ideal pick for the current phase. */
  ratioFor(value, phase) {
    const max = this.maxValue(), min = this.minValue();
    if (max === min) return 1;
    const norm = (value - min) / (max - min);
    const good = phase === PHASE.BLOCK ? 1 - norm : norm;
    return 0.25 + 0.75 * good;
  }

  isPerfect(value, phase) {
    return phase === PHASE.BLOCK ? value === this.minValue() : value === this.maxValue();
  }
  isWorst(value, phase) {
    return phase === PHASE.BLOCK ? value === this.maxValue() : value === this.minValue();
  }

  perk(key, fallback) {
    const v = this.player.perk && this.player.perk[key];
    return v == null ? fallback : v;
  }

  comboMult() {
    const boost = this.perk('comboBoost', 0);
    return COMBO_STEPS[Math.min(this.combo + (this.combo > 0 ? boost : 0), COMBO_STEPS.length - 1)];
  }

  // ── turn flow ─────────────────────────────────────────────────────────
  begin() {
    this.phase = PHASE.STRIKE;
    this.nextQuestion();
    return this.phase;
  }

  nextQuestion() {
    this.question = this.pickQuestion();
    this.eliminated = [];
    this.askedAt = performance.now();
    return this.question;
  }

  /** Burn a nutmeg: remove one of the two non-ideal options. */
  useNutmeg() {
    if (this.player.nutmegs <= 0 || this.eliminated.length > 0) return false;
    const ideal = this.phase === PHASE.BLOCK ? this.minValue() : this.maxValue();
    const candidates = this.question.options
      .map((o, i) => ({ o, i }))
      .filter(({ o }) => o.value !== ideal);
    if (candidates.length === 0) return false;
    // Remove the worst of the remaining, so it's a genuine 50:50 after.
    candidates.sort((a, b) =>
      this.ratioFor(a.o.value, this.phase) - this.ratioFor(b.o.value, this.phase));
    this.eliminated = [candidates[0].i];
    this.player.nutmegs--;
    return true;
  }

  /**
   * Player commits to an option.
   * @returns a result object the UI narrates.
   */
  answer(optionIndex, elapsedMs) {
    const opt = this.question.options[optionIndex];
    const phase = this.phase;
    const elapsed = elapsedMs == null ? performance.now() - this.askedAt : elapsedMs;
    const timedOut = elapsed >= ANSWER_MS;

    const ratio = timedOut ? 0.15 : this.ratioFor(opt.value, phase);
    const perfect = !timedOut && this.isPerfect(opt.value, phase);
    const worst = timedOut || this.isWorst(opt.value, phase);

    // speed bonus decays linearly over the clock
    const speed = timedOut ? 0
      : SPEED_BONUS_MAX * this.perk('speedMult', 1) * (1 - Math.min(1, elapsed / ANSWER_MS));

    this.answered++;
    if (perfect) {
      this.perfects++;
      this.combo++;
      this.bestCombo = Math.max(this.bestCombo, this.combo);
    } else {
      this.combo = 0;
    }

    const result = {
      phase, option: opt, optionIndex, perfect, worst, timedOut,
      ratio, speed, elapsed,
      correctValue: phase === PHASE.BLOCK ? this.minValue() : this.maxValue(),
      note: this.question.note,
      unit: this.question.unit,
      card: null, damage: 0, taken: 0, rep: 0,
    };

    if (phase === PHASE.STRIKE) {
      const base = this.player.power * (1 + (this.level - 1) * 0.1);
      let dmg = base * ratio * (1 + speed) * this.comboMult();
      if (perfect) dmg *= 1 + CRIT_BONUS;
      dmg = Math.max(1, Math.round(dmg));
      this.foe.hp = Math.max(0, this.foe.hp - dmg);
      result.damage = dmg;
      result.rep = perfect ? 25 : Math.round(12 * ratio);

      // A truly feeble answer gets you booked.
      if (worst && !timedOut) result.card = this.book();
      else if (timedOut) result.card = this.book();
    } else {
      // BLOCK: ratio 1.0 means best pick, which should take the LEAST damage.
      const floor = this.perk('blockFloor', BLOCK_FLOOR);
      const through = floor + (1 - floor) * (1 - (ratio - 0.25) / 0.75);
      let taken = Math.round(this.pendingIncoming * through * this.perk('glassJaw', 1));
      taken = Math.max(1, taken);
      this.player.hp = Math.max(0, this.player.hp - taken);
      result.taken = taken;
      result.blocked = Math.max(0, this.pendingIncoming - taken);
      result.rep = perfect ? 18 : Math.round(8 * ratio);
    }

    result.rep = Math.round(result.rep * this.perk('repMult', 1));
    this.repEarned += result.rep;
    this.lastResult = result;
    this.phase = PHASE.RESOLVE;
    this.log.push(result);
    return result;
  }

  book() {
    this.yellowCards++;
    if (this.yellowCards >= 2 && !this.redCard) {

  advance() {

    if (this.player.hp <= 0) { this.phase = PHASE.LOST; return this.phase; }

      if (this.skipCheck()) return this.phase;

      this.phase = PHASE.BLOCK;
      this.nextQuestion();

  foeAttack() {

      answered: this.answered,
      perfects: this.perfects,
      accuracy: this.answered ? this.perfects / this.answered : 0,
      bestCombo: this.bestCombo,
      cards: this.yellowCards,
      redCard: this.redCard,
      rep: this.repEarned,

__def("game/state.js", function (__exports, __req) {
/**
 * GRANDSTAND — run state and persistence.
 *
 * A run is "a day out": you pick a fighter, then climb the ladder. Energy is
 * the run limiter — every fight costs to enter and every exchange costs on top
 * — so the decision is always "push on to the next rung, or go back down and
 * beat one of them properly for the third star?"
 *
 * Rep persists between runs in the league table. Nothing else does.
 */

const { Ladder, KIND, awardStars, RUNGS } = __req("game/ladder.js");
const { findCharacter } = __req("data/characters.js");
const { hashSeed } = __req("engine/rng.js");

/**
 * The energy budget is what makes a day out a day out. It is tuned so that a
 * 12-rung ladder is just about clearable if you answer well and just about not
 * if you don't: every exchange costs, so a player who nails their answers ends
 * fights sooner and spends less. Loosen these and the ladder stops being a
 * decision and becomes a corridor.
 */
const START_ENERGY = 130;
const ENTER_COST = 10;         // walking out to face someone
const BATTLE_TURN_COST = 1;    // per exchange
const WIN_REFUND = 6;
const LOSS_PENALTY = 18;
const PHYSIO_HEAL = 0.55;      // fraction of max condition restored
const BONUS_REP = 250;

const SAVE_KEY = 'grandstand.save.v2';

class Run {
  constructor({ seed, sports = [], characterId = 'ringer', name = 'YOU' } = {}) {
    this.seed = seed || (Math.random() * 0xffffffff) >>> 0;
    this.sports = sports;
    this.name = name;
    this.character = findCharacter(characterId);
    this.ladder = new Ladder(this.seed, { sports });

    const c = this.character;
    this.player = {
      name: c.name,
      id: c.id,
      palette: c.palette,
      build: c.build,
      gear: c.gear,
      hair: c.hair,
      facial: c.facial,
      brow: c.brow,
      hp: c.hp,
      maxHp: c.hp,
      power: c.power,
      nutmegs: c.nutmegs,
      perk: c.perk || {},
    };

    this.energy = START_ENERGY;
    this.maxEnergy = START_ENERGY;
    this.rep = 0;
    this.wins = 0;
    this.losses = 0;
    this.answered = 0;
    this.perfects = 0;
    this.bestCombo = 0;
    this.usedQuestions = new Set();
    this.defeatedIds = [];
    this.at = 1;                 // which rung you are standing on
    this.over = false;
    this.outcome = null;         // 'energy' | 'champion' | 'quit'
    this.startedAt = Date.now();
  }

  get accuracy() { return this.answered ? this.perfects / this.answered : 0; }
  get rung() { return this.ladder.get(this.at); }

  canAfford(cost = ENTER_COST) { return this.energy >= cost; }

  spendEnergy(n) {
    this.energy = Math.max(0, this.energy - n);
    if (this.energy <= 0 && !this.over) this.end('energy');
    return this.energy;
  }

  end(outcome) {
    // Beating the boss always trumps an earlier ending: running the energy down
    // on the final exchange and then winning is still a championship.
    if (this.over && outcome !== 'champion') return;
    this.over = true;
    this.outcome = outcome;
    this.finishedAt = Date.now();
  }

  /** Move to a rung you have unlocked. Costs nothing — the fight is the cost. */
  moveTo(n) {
    if (!this.ladder.available(n)) return false;
    this.at = Math.max(1, Math.min(RUNGS, n));
    return true;
  }

  /** Physio and bonus rungs resolve on arrival rather than in a fight. */
  takeRest() {
    const r = this.rung;
    if (r.kind === KIND.PHYSIO) {
      const before = this.player.hp;
      this.player.hp = Math.min(this.player.maxHp,
        this.player.hp + Math.round(this.player.maxHp * PHYSIO_HEAL));
      r.cleared = true; r.stars = Math.max(r.stars, 3);
      return { kind: KIND.PHYSIO, healed: this.player.hp - before };
    }
    if (r.kind === KIND.BONUS) {
      const gain = Math.round(BONUS_REP * (this.player.perk.repMult || 1));
      this.rep += gain;
      this.player.nutmegs++;
      r.cleared = true; r.stars = Math.max(r.stars, 3);
      return { kind: KIND.BONUS, rep: gain, nutmegs: 1 };
    }
    return null;
  }

  finishBattle(rung, battle, won) {
    this.answered += battle.answered;
    this.perfects += battle.perfects;
    this.bestCombo = Math.max(this.bestCombo, battle.bestCombo);
    this.rep += battle.repEarned;
    rung.attempts++;

    if (won) {
      const wasCleared = rung.cleared;
      rung.cleared = true;
      rung.stars = Math.max(rung.stars, awardStars(battle, this.player));
      if (!wasCleared) {
        this.wins++;
        if (rung.fighter) this.defeatedIds.push(rung.fighter.id);
      }
      this.rep += battle.victoryRep();
      this.energy = Math.min(this.maxEnergy, this.energy + WIN_REFUND);
      if (rung.kind === KIND.BOSS) this.end('champion');
    } else {
      this.losses++;
      this.player.hp = Math.max(1, Math.round(this.player.maxHp * 0.3));
      this.spendEnergy(LOSS_PENALTY);
    }
  }

  scoreCard() {
    const bonus =
      this.rep +
      Math.round(this.accuracy * 500) +
      this.bestCombo * 60 +
      this.ladder.totalStars() * 50 +
      (this.outcome === 'champion' ? 1000 : 0);
    return {
      name: this.name,
      character: this.character.id,
      characterName: this.character.name,
      seed: this.seed,
      rep: bonus,
      wins: this.wins,
      losses: this.losses,
      accuracy: this.accuracy,
      bestCombo: this.bestCombo,
      answered: this.answered,
      stars: this.ladder.totalStars(),
      maxStars: this.ladder.maxStars(),
      rungs: this.ladder.clearedCount(),
      outcome: this.outcome,
      sports: this.sports.slice(),
      date: Date.now(),
    };
  }
}

// ── persistence ───────────────────────────────────────────────────────────

function readSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function writeSave(data) {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch { /* private mode */ }
}

const blankSave = () => ({
  league: [], beaten: [], totalRuns: 0, bestRep: 0, muted: false,
  lastSports: [], lastCharacter: 'ringer', lastName: 'YOU',
});

function loadSave() { return { ...blankSave(), ...(readSave() || {}) }; }

function recordRun(card) {
  const save = loadSave();
  save.league.push(card);
  save.league.sort((a, b) => b.rep - a.rep);
  save.league = save.league.slice(0, 12);
  save.totalRuns++;
  save.bestRep = Math.max(save.bestRep, card.rep);
  writeSave(save);
  return save;
}

function recordBeaten(ids) {
  const save = loadSave();
  save.beaten = Array.from(new Set([...save.beaten, ...ids]));
  writeSave(save);
  return save;
}

function savePrefs(prefs) { writeSave({ ...loadSave(), ...prefs }); }
function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch { /* ignore */ } }

function makeSeedFrom(text) {
  return text && text.trim()
    ? hashSeed(text.trim().toUpperCase())
    : (Math.random() * 0xffffffff) >>> 0;
}

/** Turn a numeric seed into something you can read out in the pub. */
const WORDS = ['SHEARER', 'BRUNO', 'GAZZA', 'DALEY', 'TORVILL', 'HENDRY', 'BOTHAM',
  'FALDO', 'MANSELL', 'GUNNELL', 'CHRISTIE', 'TAYLOR', 'BORG', 'LINEKER', 'REDGRAVE', 'DAVIS'];
function seedName(seed) {
  return `${WORDS[seed % WORDS.length]}-${(seed >> 8) % 90 + 10}`;
}

Object.assign(__exports, { START_ENERGY, ENTER_COST, BATTLE_TURN_COST, WIN_REFUND, LOSS_PENALTY, PHYSIO_HEAL, BONUS_REP, Run, loadSave, recordRun, recordBeaten, savePrefs, wipeSave, makeSeedFrom, seedName });
});

/**
 * GRANDSTAND — the host.
 *
 * He is the spine of the game. Every rung, every result and every ending is
 * introduced by him, which is what turns a list of twelve fights into an
 * afternoon of television. The register is the one every 40-something
 * recognises: unhurried, faintly pompous, fond of a pause, treating a pub quiz
 * as though it were the Olympic final.
 *
 * A pastiche of a job, not of a person — the name is a composite and no real
 * broadcaster's marks appear anywhere in the game.
 */

  id: 'des',
  name: 'DES RIDER',
  role: 'Your Host For The Afternoon',
  skin: '#f0c49b',
  hair: '#b9b2a4',
  hairStyle: 'anchor',
  suit: '#2b2b3a',
  shirt: '#d9dceb',
  tie: '#7b3f6e',

/** Deterministic enough to feel authored, varied enough not to repeat. */
let seq = 0;
function pick(lines) {
  if (!lines || !lines.length) return '';
  seq = (seq * 1103515245 + 12345) & 0x7fffffff;
  return lines[seq % lines.length];
}

  title: [

function lineForRung(rung) {
  if (rung.kind === 'boss') return pick(SCRIPT.rung.boss);

  if (rung.kind === 'bonus') return pick(SCRIPT.bonus);
  const tier = rung.fighter ? rung.fighter.tier : 1;
  return pick(SCRIPT.rung[Math.min(3, tier)] || SCRIPT.rung[1]);

  const narrow = player.hp / player.maxHp < 0.3;
  return pick(narrow ? SCRIPT.winNarrow : SCRIPT.win);
}

  if (outcome === 'champion') return pick(SCRIPT.champion);
  if (outcome === 'energy') return pick(SCRIPT.exhausted);
  return pick(SCRIPT.quit);
}
